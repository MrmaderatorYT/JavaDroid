# R8 has to hold the whole program graph, and this app ships three compilers
# (ECJ, the Kotlin compiler, R8 itself). At 4 GB it ran out of heap; the release
# build needs the headroom, and nothing else here does.
# Return unused heap promptly on machines with limited RAM; keep the same peak
# headroom for R8's bundled-compiler analysis.
org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -Dfile.encoding=UTF-8
android.useAndroidX=true
# All Android dependencies use AndroidX. Avoid repacking the bundled compiler
# JARs through Jetifier on every fresh build.
android.enableJetifier=false

# AGP 8.2 + compileSdk 35 (Play target); remove after upgrading the Android Gradle Plugin
android.suppressUnsupportedCompileSdk=35,36
