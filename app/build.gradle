    'src/main/assets/toolchains/java-se/bin-arm64.tar.xz':
        'fe948068b5fec393b2b081d2c550f15777ba2829f36ae9931e2b5fdda2ec087f',
    'src/main/assets/toolchains/java-se/bin-x86.tar.xz':
        'ddb77f5fb27ab62b8a6d316a74aa2752df7242992f86878d0a86c2d90ca4f288',
    'src/main/assets/toolchains/java-se/bin-x86_64.tar.xz':
