    'src/main/jniLibs/arm64-v8a/libjavadroid_clang.so':
        'bfe63185a80144d8d236d31462725807cba97fdc7e1d481fa511804a4f19f95a',
    'src/main/jniLibs/arm64-v8a/libjavadroid_lld.so':
