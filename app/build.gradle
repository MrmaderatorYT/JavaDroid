// The NDK archive is no longer bundled — at 344 MiB of already-compressed payload
// it took most of an App Bundle base module's 500 MB ceiling on its own, and only
// C++ users ever need it. NdkManager fetches it from its upstream release instead.
//
// Nothing local is left to checksum, so the guard moves up a level: the pin that
// NdkManager enforces at runtime must still match what README.txt documents. The
// mistake this catches is a half-done version bump — a new URL with the old hash
// would otherwise build cleanly and fail on every user's first C++ build.
ext.ndkArchiveHash =
        '02e10e4ddfe8deaeb0bd0cf29d04c981ed5bc8a5d6b560ebb9e7661f472d684b'
ext.ndkArchiveBytes = 360_538_712L

task verifyBundledToolchains {
    inputs.files bundledToolchainHashes.keySet().collect { file(it) }
    inputs.file file('src/main/java/com/ccs/javadroid/tools/compilers/NdkManager.java')
    inputs.property 'ndkArchiveHash', ndkArchiveHash
    inputs.property 'ndkArchiveBytes', ndkArchiveBytes
    doLast {
        bundledToolchainHashes.each { path, expected ->
            def payload = file(path)
            if (!payload.isFile()) {
                throw new GradleException("Bundled toolchain payload is missing: ${path}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            payload.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != expected) {
                throw new GradleException(
                    "Bundled toolchain checksum mismatch for ${path}: ${actual}")
            }
        }

        def manager = file('src/main/java/com/ccs/javadroid/tools/compilers/NdkManager.java')
        def managerText = manager.getText('UTF-8')
        if (!managerText.contains(ndkArchiveHash)) {
            throw new GradleException(
                    "NdkManager.java no longer pins the documented NDK archive SHA-256 " +
                    "(${ndkArchiveHash}). Update README.txt and ndkArchiveHash together, " +
                    "or the app will reject every download.")
        }
        def digits = String.valueOf(ndkArchiveBytes)
        if (!managerText.contains(digits) && !managerText.contains(
                digits.replaceAll(/(?<=\d)(?=(\d{3})+$)/, '_'))) {
            throw new GradleException(
                    "NdkManager.java no longer pins the documented NDK archive length " +
                    "(${ndkArchiveBytes} bytes). Update README.txt and ndkArchiveBytes " +
                    "together with it.")
        }
    }
}

/**
 * Copies a language runtime's jars into assets.
 *
 * Transitive, because these are not single jars: Clojure needs spec.alpha, and
 * the Scala 3 compiler needs the 2.13 standard library alongside its own.
 */
task prepareScalaRuntime(type: Copy) {
    def config = configurations.detachedConfiguration(
        dependencies.create("org.scala-lang:scala3-compiler_3:${bundledScalaVersion}")
    )
    // JLine and JNA are the REPL's terminal handling. Nothing here starts a
    // REPL, and JNA carries native code for desktop platforms that would never
    // load on Android anyway.
    config.exclude group: 'org.jline'
    config.exclude group: 'net.java.dev.jna'
    from config
    into "$buildDir/generated/assets/language-runtimes/languages/scala"
}

task prepareGroovyRuntime(type: Copy) {
    def config = configurations.detachedConfiguration(
        dependencies.create("org.apache.groovy:groovy:${bundledGroovyVersion}")
    )
    config.transitive = false
    from config
    into "$buildDir/generated/assets/language-runtimes/languages/groovy"
}

task prepareClojureRuntime(type: Copy) {
    def config = configurations.detachedConfiguration(
        dependencies.create("org.clojure:clojure:${bundledClojureVersion}")
    )
    from config
    into "$buildDir/generated/assets/language-runtimes/languages/clojure"
}

task prepareKotlinStdlib(type: Copy) {
    def kotlinStdlibConfig = configurations.detachedConfiguration(
        dependencies.create("org.jetbrains.kotlin:kotlin-stdlib:${kotlinCompilerVersion}")
    )
    kotlinStdlibConfig.transitive = false
    from kotlinStdlibConfig
    into "$buildDir/generated/assets/kotlin-stdlib"
    rename { "kotlin-stdlib.jar" }
}

preBuild.dependsOn patchAndroidJar, prepareJavaSeBootstrap, verifyBundledToolchains,
        prepareKotlinStdlib, prepareScalaRuntime, prepareGroovyRuntime, prepareClojureRuntime
