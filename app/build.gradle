plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.ccs.javadroid'
    compileSdk 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // Unique ID for Google Play (change if you use your own domain)
        applicationId 'com.ccs.javadroid'
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName '1.9.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                          "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += '**/*.kotlin_builtins'
            excludes += 'META-INF/*.kotlin_module'
            excludes += 'META-INF/proguard/*'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/LICENSE'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets/patched-android-jar"
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'
    implementation 'io.github.Rosemoe.sora-editor:language-java:0.23.6'

    implementation files("$buildDir/intermediates/patched-ecj/ecj-patched.jar") {
        builtBy 'patchEcjJar'
    }
    // D8 reads class files up to major 69 (Java 25) from 8.13 on; 8.7 stopped at 67.
    implementation 'com.android.tools:r8:8.13.19'

    implementation 'androidx.documentfile:documentfile:1.0.1'

    // RAR reading for project import. Pure Java, RAR4 only — RAR5 is refused
    // with an explanation rather than a stack trace (see RarSupport).
    implementation 'com.github.junrar:junrar:7.5.5'

    // JVM bytecode disassembly (javap-style text, like Recaf)
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-util:9.6'

    // JGit — pure Java git implementation (works on Android, no native binary, no root)
    implementation('org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r') {
        // JGit's bundled HTTP/SSH transports we don't need; SLF4J pulled separately
        exclude group: 'com.jcraft', module: 'jsch'
    }
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    // Kotlin Runtime Compiler support for on-device compilation
    implementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // kotlin-compiler-embeddable's XmlReader needs javax.xml.stream (StAX) — not in Android DEX
    implementation 'javax.xml.stream:stax-api:1.0-2'
    implementation 'org.codehaus.woodstox:stax2-api:4.2.2'

    // SVG rendering
    implementation 'com.caverock:androidsvg:1.4'

    // HTTP client for built-in REST client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Offline speech-to-text (Vosk)
    implementation 'com.alphacephei:vosk-android:0.3.75'

    // JSON parsing for HTTP client
    implementation 'org.json:json:20231013'

    // App Startup — optimize initialization
    implementation 'androidx.startup:startup-runtime:1.1.1'

    // Baseline Profiles — faster cold start
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}

configurations.all {
    // JGit transitively pulls Bouncycastle which clashes with Android's built-in;
    // JGit core works without it for our HTTPS-only use case.
    exclude group: 'org.bouncycastle'
}

android.applicationVariants.all { variant ->
    variant.registerJavaGeneratingTask(patchEcjSource, file("$buildDir/generated/source/patched-ecj"))
}

// ── Bundled batch compiler ───────────────────────────────────────────────────
// ECJ is shipped inside the APK and runs on the device, so it may only call
// APIs that exist on minSdk. A handful of its sources use JDK 9+ methods that
// Android gained much later (or never), and those are recompiled from patched
// sources below. Two rules keep this honest:
//   * every anchor is asserted — a silent no-op replacement would ship an APK
//     that crashes on older devices instead of failing the build here;
//   * the original .class files are excluded from the jar so the patched
//     sources are what actually loads.
// 3.46 raises the ceiling to -source 25 (3.38 stopped at 22) and drops
// everything below 1.8, which JavaVersions.MIN_COMPILABLE mirrors.
ext.ecjVersion = '3.46.0'

// path → [ [why, exact text to find, replacement], … ]
ext.ecjPatches = [
    'org/eclipse/jdt/internal/compiler/util/Util.java': [
        [
            'InputStream.readAllBytes() is API 33; minSdk is 26',
            "public static byte[] getInputStreamAsByteArray(InputStream input) throws IOException {\n\t\treturn input.readAllBytes(); // will have even slighly better performance as of JDK17+ see JDK-8264777\n\t}",
            """public static byte[] getInputStreamAsByteArray(InputStream input) throws IOException {
		java.io.ByteArrayOutputStream buffer = new java.io.ByteArrayOutputStream();
		int nRead;
		byte[] data = new byte[4096];
		while ((nRead = input.read(data, 0, data.length)) != -1) {
			buffer.write(data, 0, nRead);
		}
		return buffer.toByteArray();
	}"""
        ],
        [
            'InputStream.readNBytes(int) is API 33; minSdk is 26',
            "public static byte[] readNBytes(InputStream input, int byteLength) throws IOException {\n\t\treturn input.readNBytes(byteLength);\n\t}",
            """public static byte[] readNBytes(InputStream input, int byteLength) throws IOException {
		byte[] result = new byte[byteLength];
		int bytesRead = 0;
		while (bytesRead < byteLength) {
			int read = input.read(result, bytesRead, byteLength - bytesRead);
			if (read == -1) {
				break;
			}
			bytesRead += read;
		}
		if (bytesRead < byteLength) {
			return java.util.Arrays.copyOf(result, bytesRead);
		}
		return result;
	}"""
        ],
        [
            // Reached for every class read out of a dependency jar, so this one
            // fires on any project that has libraries, not just exotic setups.
            'readAllBytes() again, on the zip-entry path',
            "\t\t\treturn inputStream.readAllBytes();\n",
            "\t\t\treturn getInputStreamAsByteArray(inputStream);\n"
        ]
    ],
    'org/eclipse/jdt/internal/compiler/parser/Parser.java': [
        [
            // Android has no java.lang.Runtime.Version at any API level. ECJ
            // only uses it to warn that -source is newer than it understands,
            // which its own option validation already rejects before parsing.
            'java.lang.Runtime.Version does not exist on Android',
            """		if (this.problemReporter != null && this.options != null && this.options.requestedSourceVersion != null && !this.options.requestedSourceVersion.isBlank()) {
			try {
				var requestedVersion = Version.parse(this.options.requestedSourceVersion);
				var latestVersion = Version.parse(CompilerOptions.getLatestVersion());
				if (requestedVersion.compareTo(latestVersion) > 0) {
					this.problemReporter.tooRecentJavaVersion(requestedVersion.toString(), latestVersion.toString());
				}
			} catch (Exception ex) {
				this.problemReporter.abortDueToInternalError(ex.getMessage());
			}
		}
""",
            "\t\t// PATCHED OUT: see ecjPatches in app/build.gradle.\n"
        ],
        [
            'the import goes with it',
            "import java.lang.Runtime.Version;\n",
            ""
        ]
    ]
]

task patchEcjJar(type: Jar) {
    def ecjConfiguration = configurations.detachedConfiguration(
        dependencies.create("org.eclipse.jdt:ecj:${ecjVersion}")
    )
    dependsOn ecjConfiguration

    from zipTree(ecjConfiguration.singleFile)
    // Drop exactly the types rebuilt from patched sources — ParserBasicInformation
    // and friends live in the same packages and must survive.
    exclude 'org/eclipse/jdt/internal/compiler/util/Util.class'
    exclude 'org/eclipse/jdt/internal/compiler/util/Util$*.class'
    exclude 'org/eclipse/jdt/internal/compiler/parser/Parser.class'
    exclude 'org/eclipse/jdt/internal/compiler/parser/Parser$*.class'

    destinationDirectory = file("$buildDir/intermediates/patched-ecj")
    archiveFileName = 'ecj-patched.jar'
}

task patchEcjSource {
    def ecjSourcesConfiguration = configurations.detachedConfiguration(
        dependencies.create("org.eclipse.jdt:ecj:${ecjVersion}:sources")
    )
    inputs.files(ecjSourcesConfiguration)
    inputs.property('patches', ecjPatches.toString())
    def outputDir = file("$buildDir/generated/source/patched-ecj")
    outputs.dir(outputDir)

    doLast {
        def sourcesJar = ecjSourcesConfiguration.singleFile
        outputDir.mkdirs()

        def patched = [] as Set
        zipTree(sourcesJar).visit { FileVisitDetails details ->
            def path = details.relativePath.pathString
            def edits = ecjPatches[path]
            if (edits == null) return

            // Sources ship with CRLF; the anchors below are written with LF.
            def content = details.file.getText('UTF-8').replace("\r\n", "\n")
            edits.each { why, find, replace ->
                if (!content.contains(find)) {
                    throw new GradleException(
                        "ECJ ${ecjVersion}: patch anchor not found in ${path} (${why}).\n" +
                        "Upstream changed this code. Re-check the source and update " +
                        "ext.ecjPatches in app/build.gradle before releasing — shipping " +
                        "the unpatched class crashes on devices below API 33.")
                }
                content = content.replace(find, replace)
            }

            def outputFile = file("$outputDir/$path")
            outputFile.parentFile.mkdirs()
            outputFile.setText(content, 'UTF-8')
            patched << path
            println "Patched ECJ source: ${path} (${edits.size()} edits)"
        }

        def missing = ecjPatches.keySet() - patched
        if (!missing.isEmpty()) {
            throw new GradleException(
                "ECJ ${ecjVersion}: sources jar has no ${missing.join(', ')}. " +
                "Update ext.ecjPatches in app/build.gradle.")
        }
    }
}

task compileStubs(type: JavaCompile) {
    source = fileTree(dir: 'src/main/stub')
    destinationDirectory = file("$buildDir/stubs")
    classpath = files()
    options.compilerArgs = [
        "--patch-module", "java.base=" + file("src/main/stub").absolutePath,
        "-source", "8",
        "-target", "8"
    ]
}

task patchAndroidJar {
    dependsOn compileStubs
    
    def originalJar = file("android-sdk-jar/android.jar")
    def tempJar = file("$buildDir/patched-android.jar")
    def patchedJar = file("$buildDir/generated/assets/patched-android-jar/android.jar")
    def stubClassesDir = file("$buildDir/stubs")
    
    inputs.file(originalJar)
    inputs.dir(stubClassesDir)
    outputs.file(patchedJar)
    
    doLast {
        if (!originalJar.exists()) {
            throw new GradleException("Original android.jar not found at ${originalJar.absolutePath}")
        }
        
        tempJar.parentFile.mkdirs()
        patchedJar.parentFile.mkdirs()
        
        java.util.zip.ZipOutputStream zos = new java.util.zip.ZipOutputStream(new FileOutputStream(tempJar))
        
        // 1. Copy everything from original jar, EXCEPT existing java/lang/invoke/StringConcatFactory/Exception if any
        java.util.zip.ZipFile zipFile = new java.util.zip.ZipFile(originalJar)
        def entries = zipFile.entries()
        byte[] buffer = new byte[4096]
        while (entries.hasMoreElements()) {
            def entry = entries.nextElement()
            if (new File(stubClassesDir, entry.name).exists()) {
                continue;
            }
            if (entry.name.startsWith("java/lang/invoke/StringConcatFactory") ||
                entry.name.startsWith("java/lang/invoke/StringConcatException")) {
                continue;
            }
            zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
            def is = zipFile.getInputStream(entry)
            int read
            while ((read = is.read(buffer)) != -1) {
                zos.write(buffer, 0, read)
            }
            zos.closeEntry()
        }
        zipFile.close()
        
        // 2. Add compiled stub class files
        fileTree(stubClassesDir).visit { FileVisitDetails details ->
            if (details.file.isFile()) {
                def path = details.relativePath.pathString
                zos.putNextEntry(new java.util.zip.ZipEntry(path))
                details.file.withInputStream { is ->
                    int read
                    while ((read = is.read(buffer)) != -1) {
                        zos.write(buffer, 0, read)
                    }
                }
                zos.closeEntry()
                println "Added stub to android.jar: " + path
            }
        }
        
        zos.close()
        
        // 3. Replace original jar safely
        try {
            java.nio.file.Files.move(
                tempJar.toPath(), 
                patchedJar.toPath(), 
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            println "android.jar successfully patched and written to generated assets!"
        } catch (java.io.IOException e) {
            throw new GradleException("Failed to move patched android.jar. This usually happens if the file is locked by a process. Error: " + e.getMessage(), e)
        }
    }
}

preBuild.dependsOn patchAndroidJar
